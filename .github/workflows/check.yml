name: Check ben-ran.timepad.ru events

on:
  schedule:
    # Каждые 4 часа (00:05, 04:05, ... UTC). Cron в GitHub Actions
    # не гарантирует точную минуту запуска.
    - cron: "5 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ben-ran-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git add state.json
            git commit -m "chore: update state $(date -u +%FT%TZ)"
            git push
          else
            echo "state.json unchanged"
          fi
